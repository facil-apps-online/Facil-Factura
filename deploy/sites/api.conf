# API principal: api.facil-factura.pro
server {
    listen 80;
    server_name api.facil-factura.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.facil-factura.pro;

    ssl_certificate /etc/letsencrypt/live/api.facil-factura.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.facil-factura.pro/privkey.pem;

    client_max_body_size 50m;

    # Upstreams por variable: fuerzan resolución en tiempo de ejecución (ver resolver en
    # nginx.conf). Con nombre literal nginx cachea la IP al arrancar, y al recrearse un
    # contenedor el tráfico acaba en el servicio equivocado.
    # Estas locations no llevan URI propia en proxy_pass, así que nginx pasa la URI
    # original tal cual; con variable hay que hacerlo explícito con $request_uri.
    set $upstream_api_tenant fel-api-tenant;
    set $upstream_api_superadmin fel-api-superadmin;
    set $upstream_api_client fel-api-client;
    set $upstream_api_integration fel-api-integration;

    # Enrutado por prefijo:
    # - /api/tenant/*, /api/v1/*, /api/co/minsalud/* -> Fel.Api.Tenant (5103)
    # - /api/superadmin/*                            -> Fel.Api.Superadmin (5105)
    # - /api/client/*, /api/developer/*               -> Fel.Api.Client (5106)
    # - /api/co/dian/invoices, credit-notes, etc.     -> Fel.Api.Integration (5104)

    # Salud en la raíz: sin esto, "/" no matchea ningún location y nginx devuelve 404 —
    # el paso de verificación del deploy lo mostraba como si fuera un fallo real (backlog #11).
    # Fel.Api.Integration ya expone GET / con un texto fijo; sirve como comprobación real de
    # que al menos ese backend está arriba, no una respuesta estática de nginx.
    location = / { proxy_pass http://$upstream_api_integration:5104/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }

    location /api/tenant/ { proxy_pass http://$upstream_api_tenant:5103$request_uri; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/v1/ { proxy_pass http://$upstream_api_tenant:5103$request_uri; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/superadmin/ { proxy_pass http://$upstream_api_superadmin:5105$request_uri; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/client/ { proxy_pass http://$upstream_api_client:5106$request_uri; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/developer/ { proxy_pass http://$upstream_api_client:5106$request_uri; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/habilitacion { proxy_pass http://$upstream_api_client:5106$request_uri; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/Certificate { proxy_pass http://$upstream_api_client:5106$request_uri; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/Client { proxy_pass http://$upstream_api_client:5106$request_uri; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/Customer { proxy_pass http://$upstream_api_client:5106$request_uri; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/Product { proxy_pass http://$upstream_api_client:5106$request_uri; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/v1/branding { proxy_pass http://$upstream_api_client:5106$request_uri; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/v1/dashboard { proxy_pass http://$upstream_api_client:5106$request_uri; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }

    # Endpoints de integración (Fel.Api.Integration) — prefijo país/autoridad (hoy solo co/dian)
    location ~ ^/api/co/dian/(invoices|credit-notes|debit-notes|documents|equivalent-documents|health-invoices|payroll|reception-events|support-documents|transport-invoices)(/|$) {
        proxy_pass http://$upstream_api_integration:5104$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # RIPS independiente de factura, directo a MinSalud (Fel.Api.Tenant, TenantDocumentsController)
    location ~ ^/api/co/minsalud/ {
        proxy_pass http://$upstream_api_tenant:5103$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # DevExpress Report Designer / Viewer (Fel.Api.Integration)
    location ~ ^/(DXXRD|DXXRDV) {
        proxy_pass http://$upstream_api_integration:5104$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Documentación pública del API (Swagger UI + OpenAPI JSON), Fel.Api.Integration
    location ~ ^/(swagger|openapi)(/|$) {
        proxy_pass http://$upstream_api_integration:5104$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Documentación pública del API v1 (documentos independientes de factura, incl. RIPS
    # standalone hacia MinSalud), Fel.Api.Tenant — ruta propia para no chocar con el /swagger
    # de Fel.Api.Integration.
    location ~ ^/swagger-v1(/|$) {
        proxy_pass http://$upstream_api_tenant:5103$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
