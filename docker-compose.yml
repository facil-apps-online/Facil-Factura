services:
  # ---------- Infra ----------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fel-sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=Developer
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: fel-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Migraciones ----------
  # Único punto donde cambia el esquema de FelDb. Corre una vez, hasta completar,
  # y el resto de servicios .NET espera su salida con service_completed_successfully.
  # No lleva restart: un fallo debe detener el despliegue, no entrar en bucle.
  fel-migrator:
    build:
      context: .
      dockerfile: deploy/Dockerfile.migrator
    container_name: fel-migrator
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=FelDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;

  # ---------- APIs .NET ----------
  fel-api-tenant:
    build:
      context: .
      dockerfile: deploy/Dockerfile.dotnet
      args:
        PROJECT: Fel.Api.Tenant
        DEVEXPRESS_LICENSE_KEY: ${DEVEXPRESS_LICENSE_KEY:-}
    container_name: fel-api-tenant
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      fel-migrator:
        condition: service_completed_successfully
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5103
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=FelDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__RedisConnection=redis:6379
      - Security__MasterKey=${FEL_MASTER_KEY}
      - MasterKey=${FEL_MASTER_KEY}
      # Salta el RLS de Core: nunca en appsettings.json, que va a un repo publico.
      - Core__ServiceRoleKey=${CORE_SERVICE_ROLE_KEY}
      - CertificateStoragePath=/app/secure-storage
      - PublicFileStoragePath=/app/public-storage
      # MUV de FEV-RIPS del MinSalud. Corre en el VPS de Bogota (el Ministerio bloquea por
      # geolocalizacion todo acceso desde fuera de Colombia) y se alcanza por el tunel WireGuard.
      # Son dos instalaciones distintas, con imagenes y hosts propios del Ministerio: produccion
      # apunta a fevrips.sispro.gov.co y pruebas a stage-fevrips.sispropreprod.gov.co.
      # Va aca y no en la base porque la instalacion es una sola y es nuestra: cambiarla es una
      # operacion de infraestructura, no un dato que un usuario deba poder editar.
      - MinSalud__MuvProductionUrl=https://10.10.0.2:9443
      - MinSalud__MuvTestUrl=https://10.10.0.2:9444
    volumes:
      - fel_certs:/app/secure-storage
      - fel_templates:/app/templates
      - fel_public_uploads:/app/public-storage

  fel-api-integration:
    build:
      context: .
      dockerfile: deploy/Dockerfile.dotnet
      args:
        PROJECT: Fel.Api.Integration
        DEVEXPRESS_LICENSE_KEY: ${DEVEXPRESS_LICENSE_KEY:-}
    container_name: fel-api-integration
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      fel-migrator:
        condition: service_completed_successfully
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5104
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=FelDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__RedisConnection=redis:6379
      - Security__MasterKey=${FEL_MASTER_KEY}
      - MasterKey=${FEL_MASTER_KEY}
      - CertificateStoragePath=/app/secure-storage
    volumes:
      - fel_certs:/app/secure-storage
      - fel_templates:/app/templates

  fel-api-superadmin:
    build:
      context: .
      dockerfile: deploy/Dockerfile.dotnet
      args:
        PROJECT: Fel.Api.Superadmin
        DEVEXPRESS_LICENSE_KEY: ${DEVEXPRESS_LICENSE_KEY:-}
    container_name: fel-api-superadmin
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      fel-migrator:
        condition: service_completed_successfully
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5105
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=FelDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__RedisConnection=redis:6379
      - Security__MasterKey=${FEL_MASTER_KEY}
      - MasterKey=${FEL_MASTER_KEY}
      # Salta el RLS de Core: nunca en appsettings.json, que va a un repo publico.
      - Core__ServiceRoleKey=${CORE_SERVICE_ROLE_KEY}
      - CertificateStoragePath=/app/secure-storage
      - FacilReports__ApiKey=${FACIL_REPORTS_API_KEY}
    volumes:
      - fel_certs:/app/secure-storage
      - fel_templates:/app/templates

  fel-api-client:
    build:
      context: .
      dockerfile: deploy/Dockerfile.dotnet
      args:
        PROJECT: Fel.Api.Client
        DEVEXPRESS_LICENSE_KEY: ${DEVEXPRESS_LICENSE_KEY:-}
    container_name: fel-api-client
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      fel-migrator:
        condition: service_completed_successfully
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5106
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=FelDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__RedisConnection=redis:6379
      - Security__MasterKey=${FEL_MASTER_KEY}
      - MasterKey=${FEL_MASTER_KEY}
      - CertificateStoragePath=/app/secure-storage
      - PublicFileStoragePath=/app/public-storage
      # Salta el RLS de Core: nunca en appsettings.json, que va a un repo publico.
      - Core__ServiceRoleKey=${CORE_SERVICE_ROLE_KEY}
      - FacilReports__ApiKey=${FACIL_REPORTS_API_KEY}
    volumes:
      - fel_certs:/app/secure-storage
      - fel_templates:/app/templates
      - fel_public_uploads:/app/public-storage

  # ---------- Worker ----------
  fel-worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.dotnet
      args:
        PROJECT: Fel.Worker
        DEVEXPRESS_LICENSE_KEY: ${DEVEXPRESS_LICENSE_KEY:-}
    container_name: fel-worker
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      fel-migrator:
        condition: service_completed_successfully
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=FelDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__RedisConnection=redis:6379
      - Security__MasterKey=${FEL_MASTER_KEY}
      - MasterKey=${FEL_MASTER_KEY}
      - CertificateStoragePath=/app/secure-storage
    volumes:
      - fel_certs:/app/secure-storage
      - fel_templates:/app/templates

  # ---------- MinSalud FEV-RIPS ----------
  # El Mecanismo Unico de Validacion (MUV) del Ministerio YA NO CORRE EN ESTE DROPLET.
  #
  # El MSPS bloquea por geolocalizacion todo acceso a sispro.gov.co desde fuera de Colombia: desde
  # este servidor el TCP ni siquiera conecta, ni con el portal web publico. Por eso el MUV se
  # traslado a un VPS propio en Bogota (200.7.100.167), que si atraviesa ese filtro.
  #
  # Alla corre la imagen oficial vigente (crmspsgovcoprd.azurecr.io/production-fevrips-apilocal,
  # version 1.4.11.0), no la que estaba aca: esta apuntaba a fevrips.sispropreprod.gov.co, un host
  # de preproduccion dado de baja, y por eso se reiniciaba en bucle.
  #
  # Este droplet le habla por un tunel WireGuard cifrado, en https://10.10.0.2:9443, y ese puerto
  # solo acepta conexiones desde la IP de este servidor. La URL se configura por cliente en
  # Clients.MinSaludApiBaseUrl, no aca.

  # ---------- Frontends ----------
  landing-web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        APP: landing-web
    container_name: fel-landing-web
    restart: unless-stopped

  tenant-web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        APP: tenant-web
        VITE_API_URL: https://api.facil-factura.pro/api
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
    container_name: fel-tenant-web
    restart: unless-stopped

  superadmin-web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        APP: superadmin-web
        VITE_API_URL: https://api.facil-factura.pro/api/superadmin
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
        VITE_FACIL_REPORTS_URL: https://reports.facil-apps.online
        VITE_FACIL_REPORTS_API_KEY: ${FACIL_REPORTS_API_KEY}
    container_name: fel-superadmin-web
    restart: unless-stopped

  client-web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        APP: client-web
        VITE_API_URL: https://api.facil-factura.pro/api
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
    container_name: fel-client-web
    restart: unless-stopped

  developers-web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        APP: developers-web
        VITE_API_URL: https://api.facil-factura.pro/api
    container_name: fel-developers-web
    restart: unless-stopped

  # ---------- Reverse proxy ----------
  nginx:
    image: nginx:alpine
    container_name: fel-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/sites:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
      - certbot_lib:/var/lib/letsencrypt
    depends_on:
      - fel-api-tenant
      - fel-api-integration
      - fel-api-superadmin
      - fel-api-client
      - landing-web
      - tenant-web
      - superadmin-web
      - client-web
      - developers-web

  certbot:
    image: certbot/certbot
    container_name: fel-certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
      - certbot_lib:/var/lib/letsencrypt
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

volumes:
  mssql_data:
  redis_data:
  fel_certs:
  fel_templates:
  fel_public_uploads:
  certbot_www:
  certbot_conf:
  certbot_lib:

