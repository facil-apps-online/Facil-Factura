server {
    listen 80;
    server_name tenants.facil-factura.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name tenants.facil-factura.pro;

    ssl_certificate /etc/letsencrypt/live/tenants.facil-factura.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tenants.facil-factura.pro/privkey.pem;

    location / {
        # Upstream por variable: resolución en tiempo de ejecución (ver nginx.conf).
        set $upstream_tenants tenant-web;
        proxy_pass http://$upstream_tenants$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
