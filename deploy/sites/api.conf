# API principal: api.facil-factura.pro
server {
    listen 80;
    server_name api.facil-factura.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.facil-factura.pro;

    ssl_certificate /etc/letsencrypt/live/api.facil-factura.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.facil-factura.pro/privkey.pem;

    client_max_body_size 50m;

    # Enrutado por prefijo:
    # - /api/tenant/* y /api/v1/*  -> Fel.Api.Tenant (5103)
    # - /api/superadmin/*          -> Fel.Api.Superadmin (5105)
    # - /api/client/*              -> Fel.Api.Client (5106)
    # - /api/invoices, credit-notes, etc. -> Fel.Api.Integration (5104)

    location /api/tenant/ { proxy_pass http://fel-api-tenant:5103; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/v1/ { proxy_pass http://fel-api-tenant:5103; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/superadmin/ { proxy_pass http://fel-api-superadmin:5105; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/client/ { proxy_pass http://fel-api-client:5106; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/habilitacion { proxy_pass http://fel-api-client:5106; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/Certificate { proxy_pass http://fel-api-client:5106; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/Client { proxy_pass http://fel-api-client:5106; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/Customer { proxy_pass http://fel-api-client:5106; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/Product { proxy_pass http://fel-api-client:5106; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/v1/dashboard { proxy_pass http://fel-api-client:5106; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }

    # Endpoints de integración (Fel.Api.Integration)
    location ~ ^/api/(invoices|credit-notes|debit-notes|documents|equivalent-documents|health-invoices|payroll|reception-events|support-documents|transport-invoices)(/|$) {
        proxy_pass http://fel-api-integration:5104;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # DevExpress Report Designer / Viewer (Fel.Api.Integration)
    location ~ ^/(DXXRD|DXXRDV) {
        proxy_pass http://fel-api-integration:5104;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
