server {
    listen 80;
    server_name clients.facil-factura.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name clients.facil-factura.pro;

    ssl_certificate /etc/letsencrypt/live/clients.facil-factura.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clients.facil-factura.pro/privkey.pem;

    # Upstreams por variable: resolución en tiempo de ejecución (ver resolver en nginx.conf).
    set $upstream_clients client-web;
    set $upstream_api_tenant fel-api-tenant;

    # OG image generada por tenant (1200x630)
    location ~ ^/og/([a-z0-9][a-z0-9-]*)\.png$ {
        proxy_pass http://$upstream_api_tenant:5103/api/tenant/site/$1/og-image.png;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Micrositio público por slug (un solo segmento, excluye rutas del SPA)
    location ~ ^/(?!api|og|login|register|settings|resolutions|customers|products|invoices|payments)([a-z0-9][a-z0-9-]*)/?$ {
        proxy_pass http://$upstream_api_tenant:5103/api/tenant/site/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://$upstream_clients$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
