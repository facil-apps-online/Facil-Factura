events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 50m;

    # DNS interno de Docker. Sin esto, nginx resuelve los nombres de los contenedores
    # una sola vez al cargar la configuración y se queda con la IP cacheada: al recrear
    # un contenedor, Docker le asigna otra IP y nginx sigue enviando el tráfico a la
    # antigua, que para entonces puede pertenecer a otro servicio.
    # Con resolver + upstream por variable (ver conf.d/*.conf) la resolución pasa a ser
    # por petición, con el TTL de abajo, y además nginx arranca aunque el backend todavía
    # no exista, devolviendo 502 temporal en vez de negarse a levantar.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    include /etc/nginx/conf.d/*.conf;
}
